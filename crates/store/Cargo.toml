[package]
name = "rp-store"
version.workspace = true
edition.workspace = true
# Not published to a registry; cargo-deny infers "private crate" from this.
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `bundled` compiles SQLite from source, so CI needs no system sqlite on any of
# the three platforms and the version cannot drift between them.
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "7"
