[package]
name = "rp-mcp"
version.workspace = true
edition.workspace = true
# Not published to a registry; cargo-deny infers "private crate" from this.
publish = false

[lib]
name = "rp_mcp"
path = "src/lib.rs"

[[bin]]
name = "rp-mcp"
path = "src/main.rs"

[dependencies]
rp-store = { path = "../store" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Already in the tree via rp-store, so this adds no crate and no build time. It
# is here for its date functions: SQLite's 'localtime' modifier is how the store
# groups entries into days, so parsing "today" the same way is the only way the
# two cannot disagree about where a day boundary is. The alternative -- chrono or
# jiff -- would be a new dependency *and* a second timezone implementation.
rusqlite = { version = "0.40", features = ["bundled"] }
# The Streamable HTTP transport. `default-features = false` keeps it to routing
# plus a JSON body: no multipart, no form, no tracing.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
# Bearer tokens and session ids. Already in the tree via rusqlite/gpui; it is the
# OS random source and nothing else, which is all a token needs.
getrandom = { version = "0.4", features = ["std"] }

[dev-dependencies]
# The HTTP tests talk to the server over a real socket rather than calling the
# handlers. Already in the tree via rp-core.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
