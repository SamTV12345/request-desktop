[package]
name = "request-pilot"
version.workspace = true
edition.workspace = true
# Not published to a registry; cargo-deny infers "private crate" from this.
publish = false

[dependencies]
anyhow.workspace = true
rp-core = { path = "../core" }
rp-devtools = { path = "../devtools" }
# EXPERIMENT: gpui straight from zed's repo instead of the crates.io snapshot.
# Pinned by `rev` on purpose — a floating git dependency means CI builds
# something different tomorrow, from a repo we do not control.
gpui = { git = "https://github.com/zed-industries/zed", rev = "3b79b56201f35dc87788e6a8ed9d432575484769" }
# The platform backends live in their own crate since the gpui split; the app
# must now hand one to `Application::with_platform`.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3b79b56201f35dc87788e6a8ed9d432575484769" }
# The design system: tokens, the theme, and every shared building block. The app
# draws from here rather than growing its own second copy of a button.
rp-ui = { path = "../ui" }
unicode-segmentation = "1.13.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
# The update check and download. Already in the graph via `rp-core`, so this adds
# a name here and nothing to the build.
reqwest = { version = "0.12", features = ["json"] }
serde_json.workspace = true
rp-store = { path = "../store" }
# The MCP server, hosted in-process over HTTP when the user turns it on in
# settings. Same crate the `rp-mcp` stdio binary is built from.
rp-mcp = { path = "../mcp" }

[build-dependencies]
winresource = "0.1.31"
