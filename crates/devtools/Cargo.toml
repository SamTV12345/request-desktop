[package]
name = "rp-devtools"
version.workspace = true
edition.workspace = true
# Not published to a registry; cargo-deny infers "private crate" from this.
publish = false

[dependencies]
aes = "0.9.1"
anyhow.workspace = true
base64 = "0.23.0"
bcrypt = "0.19.2"
bip39 = "2.2.2"
cbc = "0.2.1"
chrono = "0.4.45"
croner = "3.0.1"
csscolorparser = "0.8.3"
csv = "1.4.0"
des = "0.9.0"
hmac = "0.13.0"
html-escape = "0.2.14"
iban_validate = "5.0.1"
ipnet = "2.12.0"
macaddr = "1.0.1"
md-5 = "0.11.0"
mime_guess = "2.0.5"
num-bigint = "0.5.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
quick-xml = "0.41.0"
rand = "0.10.2"
rc4 = "0.2.0"
regex = "1.13.1"
ripemd = "0.2.0"
roman = "0.2.1"
rsa = "0.9.10"
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
similar = "3.1.1"
slug = "0.1.6"
sqlformat = "0.5.0"
toml = "1.1.3"
totp-rs = "5.7.2"
ulid = "3.0.0"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v1", "v4", "v7"] }
woothee = "0.13.0"
zxcvbn = "3.1.1"
