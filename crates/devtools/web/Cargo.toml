[package]
name = "rp-devtools-web"
version.workspace = true
edition.workspace = true
# Not published to a registry; cargo-deny infers "private crate" from this.
publish = false

[lib]
name = "rp_devtools_web"
path = "src/lib.rs"

[dependencies]
rp-devtools-common = { path = "../common" }
anyhow.workspace = true
base64 = "0.23.0"
chrono = "0.4.45"
croner = "3.0.1"
html-escape = "0.2.14"
iban_validate = "5.0.1"
ipnet = "2.12.0"
macaddr = "1.0.1"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rand = "0.10.2"
serde_json.workspace = true
serde_norway = "0.9.42"
sha1 = "0.11.0"
slug = "0.1.6"
woothee = "0.13.0"
