name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Builds the GPUI app. The Tauri app and its web frontend this workflow used to
# assemble — pnpm, vite, tauri-action, the webkit2gtk packages — are gone: the
# Rust binary is the whole product now, so there is nothing to build first.
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p request-pilot -p rp-mcp

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: toolbench-${{ matrix.platform }}
          path: |
            target/release/request-pilot.exe
            target/release/rp-mcp.exe
          if-no-files-found: error
