name: CI

# Quality gates for the GPUI workspace (rp-core, rp-devtools, request-pilot).
# The legacy Tauri release pipeline lives in build.yml and is untouched by this file.
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: re-runs the gates against a fresh advisory database (so a newly
  # published RUSTSEC advisory shows up without anyone opening a PR) and drives
  # the fuzz-smoke job below.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep incremental artifacts out of the cache; CI never reuses them within a job.
  CARGO_INCREMENTAL: 0

# A newer push to the same branch supersedes an in-flight run. `main` is excluded
# so the nightly/push history on the default branch stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# NOTE ON JOB INDEPENDENCE: no job below uses `needs`. A formatting failure must
# not mask a failing test, so every gate reports its own verdict in parallel.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Pure parse-and-print: needs no system libraries and no cargo cache.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # request-pilot depends on gpui, so this job compiles the GPU stack.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # This gate is currently RED: the workspace has pre-existing lints in
      # crates/core, crates/devtools and crates/app (collapsible ifs,
      # type_complexity, manual_is_multiple_of, format_in_format_args,
      # large_enum_variant, field_reassign_with_default, manual_strip,
      # manual Vec::pop_if, single-pattern match). They are deliberately NOT
      # allow-listed here -- the code owners fix them, CI does not hide them.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Do not let one platform's failure hide the others'.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Only rp-core needs system libraries here: reqwest's default TLS backend
      # is native-tls, which links OpenSSL on Linux. Windows uses schannel and
      # macOS uses Security.framework, so neither needs a package step.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # Scoped to the two library crates on purpose -- see CONTRIBUTING.md
      # ("What CI does not cover"). request-pilot is a gpui GUI shell with no
      # tests of its own; compiling gpui on all three runners would triple CI
      # time for no extra assertions. Its compile+link is covered by build-app.
      - name: Run test suite
        run: cargo test -p rp-core -p rp-devtools -p rp-devtools-common -p rp-devtools-crypto -p rp-devtools-data -p rp-devtools-text -p rp-devtools-web -p rp-devtools-community

  build-app:
    # The only job that fully compiles AND LINKS request-pilot. clippy type-checks
    # it but never invokes the linker, so this is what catches a missing gpui
    # system library (-lxkbcommon, -lxcb, freetype).
    name: build request-pilot (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-app
      - run: cargo build -p request-pilot

  coverage:
    name: coverage (rp-core + rp-devtools)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # Nightly is required: cargo-llvm-cov's --branch needs -Z coverage-options=branch.
      # Branch coverage is the metric that matters for parser edge cases, so it is
      # worth the nightly pin here even though every other job runs on stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Collect once, then render twice. `--summary-only` and `--lcov` cannot be
      # combined in a single invocation -- doing so silently truncates the lcov
      # file to a few hundred bytes -- so profiling data is gathered with
      # --no-report and `llvm-cov report` formats it without re-running tests.
      #
      # --ignore-run-fail is deliberate: this job REPORTS coverage and must still
      # publish a number when a test fails. The `test` job above is what gates on
      # failures, so suppressing them here loses no signal.
      - name: Collect coverage data
        run: |
          cargo +nightly llvm-cov --branch --ignore-run-fail --no-report \
            -p rp-core -p rp-devtools -p rp-devtools-common -p rp-devtools-crypto -p rp-devtools-data -p rp-devtools-text -p rp-devtools-web -p rp-devtools-community

      - name: Render lcov report
        run: cargo +nightly llvm-cov report --branch --lcov --output-path lcov.info

      # Reported, never enforced. A coverage threshold on a young codebase is a
      # gate somebody disables in a hurry; the number belongs in review instead.
      - name: Branch coverage summary
        run: cargo +nightly llvm-cov report --branch --summary-only | tee coverage-summary.txt

      - name: Publish summary to the job log
        if: always()
        run: |
          {
            echo '### Branch coverage (rp-core + rp-devtools)'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage
          path: |
            lcov.info
            coverage-summary.txt
          if-no-files-found: warn

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `-A unlicensed` downgrades exactly one diagnostic. rp-core, rp-devtools
      # and request-pilot declare no `license` field and no `publish = false`, and
      # cargo-deny derives "is this crate private?" solely from `publish`, so it
      # treats our own unpublished crates as unlicensed public crates. Every
      # third-party license is still checked against the allow-list in deny.toml.
      # Remove this flag once the three manifests gain `publish = false`.
      - run: cargo deny check -A unlicensed

  fuzz-smoke:
    name: fuzz smoke (60s per target)
    # Scheduled and manual only. cargo-fuzz needs nightly and a fresh build of
    # every target; that does not belong in a PR's critical path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The fuzz crate is outside the workspace (`exclude = ["fuzz"]`) and is
      # landing separately. Tolerate its absence instead of going red.
      - name: Detect fuzz crate
        id: detect
        run: |
          if [ -f fuzz/Cargo.toml ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::no fuzz/Cargo.toml yet - nothing to smoke-test'
          fi

      - name: Install Linux system dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@nightly
        if: steps.detect.outputs.present == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.present == 'true'
        with:
          workspaces: './fuzz -> target'
          key: fuzz
      - uses: taiki-e/install-action@v2
        if: steps.detect.outputs.present == 'true'
        with:
          tool: cargo-fuzz

      # Targets are discovered, not hard-coded, so adding a fuzz_target to
      # fuzz/Cargo.toml is enough to get it smoke-tested.
      - name: Run each target for 60s
        if: steps.detect.outputs.present == 'true'
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets="$(cargo +nightly fuzz list)"
          if [ -z "$targets" ]; then
            echo '::notice::fuzz crate present but declares no targets'
            exit 0
          fi
          echo "discovered targets:"; echo "$targets"
          status=0
          for t in $targets; do
            echo "::group::fuzzing $t"
            # -runs caps work on a fast machine; -max_total_time caps wall clock.
            # --target is explicit: the prebuilt cargo-fuzz is musl-linked and
            # defaults --target to its *own* triple, and ASan cannot be used with
            # a statically linked libc.
            if ! cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- \
                  -max_total_time=60 -print_final_stats=1; then
              echo "::error::fuzz target $t failed (crash or build error)"
              status=1
            fi
            echo '::endgroup::'
          done
          exit $status

      # Reproducers are the whole point of a fuzz run; keep them even on failure.
      - name: Upload crash artifacts
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
